<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IU</title>
    <link rel="stylesheet" href="../common/marks.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!--
      The chrome toggle sits in the LANGUAGE row, not the reading row.

      A control must not live inside the region it controls. This was put in the
      reading bar and that bar is exactly what collapsing hides, so collapsing
      removed the only way back — the panel was stuck with no visible control at
      all. Both rows survive collapse, so either would work; this one is chosen
      because the reading bar is the one being hidden, and keeping the toggle out
      of it makes that self-evident.

      A button rather than a select: a select is for choosing among values, and
      this is one action with two states. The label says what you will GET, not
      what you have, so the button is never ambiguous about what pressing it does.
    -->
    <header class="bar">
      <div class="lang">
        <select id="study" aria-label="Language to learn"></select>
        <label class="line-translate" title="Replace this line with a machine translation">
          <input type="checkbox" id="study-translated" aria-label="Translate the first line" />
          MT
        </label>
      </div>
      <button id="swap" type="button" title="Swap the two lines" aria-label="Swap the two lines">&#8646;</button>
      <div class="lang">
        <select id="gloss" aria-label="Second line, explaining the first"></select>
        <label class="line-translate" title="Replace this line with a machine translation">
          <input type="checkbox" id="gloss-translated" aria-label="Translate the second line" />
          MT
        </label>
      </div>
      <button id="layout" type="button" class="layout-toggle" aria-pressed="false" title="Hide the reading controls">&#9650;</button>
      <!--
        The way into the settings view.

        An icon rather than the word "Settings": the header is three controls and a
        swap arrow already, and a word here would be the widest thing in the row.
        The label is on `aria-label`, so it is still named for a screen reader.
      -->
      <button id="settings-toggle" type="button" class="settings-toggle" aria-pressed="false" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="17" height="17">
          <path d="M10.09 2.80 L13.91 2.80 L13.31 5.12 L15.93 6.21 L17.16 4.14 L19.86 6.84 L17.79 8.07 L18.88 10.69 L21.20 10.09 L21.20 13.91 L18.88 13.31 L17.79 15.93 L19.86 17.16 L17.16 19.86 L15.93 17.79 L13.31 18.88 L13.91 21.20 L10.09 21.20 L10.69 18.88 L8.07 17.79 L6.84 19.86 L4.14 17.16 L6.21 15.93 L5.12 13.31 L2.80 13.91 L2.80 10.09 L5.12 10.69 L6.21 8.07 L4.14 6.84 L6.84 4.14 L8.07 6.21 L10.69 5.12 Z" fill="currentColor" />
          <circle cx="12" cy="12" r="3.4" fill="var(--bg)" />
        </svg>
      </button>
    </header>

    <!--
      The translate target, one per panel rather than one per line: it is a
      preference you set once, and what varies per line is only WHETHER that line
      is translated — which is what the two checkboxes above are for. Either line
      can be translated; both at once is allowed.
    -->
    <div id="translate-target-row" class="translate-target-row" hidden>
      <span class="translate-target-label">Translate into</span>
      <select id="translate-into" aria-label="Language to translate into"></select>
    </div>

    <header class="bar learning">
      <select id="view-mode" aria-label="How much of the transcript to show"></select>
      <label class="size" title="Text size in pixels">
        <input id="font-size" type="number" min="10" max="32" step="1" aria-label="Text size in pixels" />
        <span class="size-unit">px</span>
      </label>
      <!--
        Where a word's reading goes — 拼音 for Chinese, Rōmaji for Japanese.

        A select rather than a toggle, because the four values are genuinely
        different layouts rather than off and on: `above` is ruby, `below` is a
        second line, `marked` annotates only what is already highlighted. The
        label is generic because the same control serves both languages; the
        options name the placement, not the language.
      -->
      <select id="reading" aria-label="Where to show the reading"></select>
      <select id="list" aria-label="Word list"></select>
      <select id="threshold" aria-label="Highlight from level"></select>
    </header>

    <p id="status" class="status" role="status">Looking for a video…</p>

    <!--
      THE SETTINGS VIEW.

      It REPLACES the transcript rather than sitting above it: a side panel is
      roughly 600px tall, and a settings section plus a transcript in that height
      gives neither enough room. One document, one thing on screen — the same
      arrangement the panel already uses for its collapsed layout.

      An empty container on purpose. The controls are built from the registry in
      `src/common/settings.js`, filtered to what has no control in the transcript
      bar, so adding a setting does not mean editing this file.
    -->
    <section id="settings-view" class="settings-view" hidden aria-label="Settings">
      <header class="settings-head">
        <h2 class="settings-title">Settings</h2>
      </header>
      <div id="settings-body" class="settings-body"></div>
    </section>

    <main id="transcript" class="transcript" aria-label="Transcript">
      <p class="empty">No transcript loaded.</p>
    </main>

    <footer class="bar">
      <label class="follow">
        <input type="checkbox" id="follow" checked />
        Follow
      </label>
      <button id="copy" type="button">Copy</button>
      <select id="format" class="format" aria-label="Export format">
        <option value="txt">.txt</option>
        <option value="srt">.srt</option>
      </select>
      <button id="save" type="button">Save</button>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
