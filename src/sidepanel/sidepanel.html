<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transcribe</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <button id="load" type="button" class="primary">Load</button>
      <select id="track" class="track" aria-label="Caption track"></select>
      <label class="follow">
        <input type="checkbox" id="follow" checked />
        Follow
      </label>
    </header>

    <p id="status" class="status" role="status">Open a YouTube video, then load its transcript.</p>

    <main id="transcript" class="transcript" aria-label="Transcript">
      <p class="empty">No transcript loaded.</p>
    </main>

    <footer class="bar">
      <button id="copy" type="button">Copy</button>
      <button id="clear" type="button">Clear</button>
      <select id="format" class="format" aria-label="Export format">
        <option value="txt">.txt</option>
        <option value="srt">.srt</option>
      </select>
      <button id="save" type="button">Save</button>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
