<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IU</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="lang">
        <select id="study" aria-label="Language to learn"></select>
        <label class="line-translate" title="Replace this line with a machine translation">
          <input type="checkbox" id="study-translated" aria-label="Translate the first line" />
          MT
        </label>
      </div>
      <button id="swap" type="button" title="Swap the two lines" aria-label="Swap the two lines">&#8646;</button>
      <div class="lang">
        <select id="gloss" aria-label="Second line, explaining the first"></select>
        <label class="line-translate" title="Replace this line with a machine translation">
          <input type="checkbox" id="gloss-translated" aria-label="Translate the second line" />
          MT
        </label>
      </div>
    </header>

    <!--
      The translate target, one per panel rather than one per line: it is a
      preference you set once, and what varies per line is only WHETHER that line
      is translated — which is what the two checkboxes above are for. Either line
      can be translated; both at once is allowed.
    -->
    <div id="translate-target-row" class="translate-target-row" hidden>
      <span class="translate-target-label">Translate into</span>
      <select id="translate-into" aria-label="Language to translate into"></select>
    </div>

    <header class="bar learning">
      <select id="view-mode" aria-label="How much of the transcript to show"></select>
      <select id="layout" aria-label="How much of the chrome to show"></select>
      <label class="size" title="Text size in pixels">
        <input id="font-size" type="number" min="10" max="32" step="1" aria-label="Text size in pixels" />
        <span class="size-unit">px</span>
      </label>
      <select id="list" aria-label="Word list"></select>
      <select id="threshold" aria-label="Highlight from level"></select>
    </header>

    <p id="status" class="status" role="status">Looking for a YouTube video…</p>

    <main id="transcript" class="transcript" aria-label="Transcript">
      <p class="empty">No transcript loaded.</p>
    </main>

    <footer class="bar">
      <label class="follow">
        <input type="checkbox" id="follow" checked />
        Follow
      </label>
      <button id="copy" type="button">Copy</button>
      <select id="format" class="format" aria-label="Export format">
        <option value="txt">.txt</option>
        <option value="srt">.srt</option>
      </select>
      <button id="save" type="button">Save</button>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
