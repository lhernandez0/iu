<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IU preview</title>
    <link rel="icon" href="/icons/icon-32.png" />
    <!--
      The panel's OWN stylesheet, by its real path. Everything the preview renders
      is styled by the file that ships, so a change here is a change to the real
      panel, which is the whole point of a preview.
    -->
    <!-- The shared mark rules, which the panel and the reader both draw
         from. Loaded before the panel sheet so the panel can override. -->
    <link rel="stylesheet" href="/src/common/marks.css" />
    <link rel="stylesheet" href="/src/sidepanel/sidepanel.css" />
    <link rel="stylesheet" href="/tools/ui/preview.css" />
  </head>
  <body>
    <header class="preview-bar">
      <span class="preview-title">Preview</span>
      <nav id="preview-scenarios" class="preview-scenarios"></nav>
    </header>

    <p id="preview-note" class="preview-note"></p>

    <!--
      The panel's markup, copied from src/sidepanel/sidepanel.html.

      Duplicated rather than fetched, because that file ships to users and must
      not reference a development tool. The cost is real: a control added there
      must be added here, and forgetting shows up as "Cannot read properties of
      null" rather than as a missing control. `test/browser/ui-preview.test.mjs`
      exists to catch exactly that.
    -->
    <header class="bar">
      <div class="lang">
        <select id="study" aria-label="Language to learn"></select>
        <label class="line-translate" title="Replace this line with a machine translation">
          <input type="checkbox" id="study-translated" aria-label="Translate the first line" />
          MT
        </label>
      </div>
      <button id="swap" type="button" title="Swap the two lines" aria-label="Swap the two lines">&#8646;</button>
      <div class="lang">
        <select id="gloss" aria-label="Second line, explaining the first"></select>
        <label class="line-translate" title="Replace this line with a machine translation">
          <input type="checkbox" id="gloss-translated" aria-label="Translate the second line" />
          MT
        </label>
      </div>
      <button id="layout" type="button" class="layout-toggle" aria-pressed="false" title="Hide the reading controls">&#9650;</button>
      <button id="settings-toggle" type="button" class="settings-toggle" aria-pressed="false" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="17" height="17">
          <path d="M10.09 2.80 L13.91 2.80 L13.31 5.12 L15.93 6.21 L17.16 4.14 L19.86 6.84 L17.79 8.07 L18.88 10.69 L21.20 10.09 L21.20 13.91 L18.88 13.31 L17.79 15.93 L19.86 17.16 L17.16 19.86 L15.93 17.79 L13.31 18.88 L13.91 21.20 L10.09 21.20 L10.69 18.88 L8.07 17.79 L6.84 19.86 L4.14 17.16 L6.21 15.93 L5.12 13.31 L2.80 13.91 L2.80 10.09 L5.12 10.69 L6.21 8.07 L4.14 6.84 L6.84 4.14 L8.07 6.21 L10.69 5.12 Z" fill="currentColor" />
          <circle cx="12" cy="12" r="3.4" fill="var(--bg)" />
        </svg>
      </button>
    </header>

    <div id="translate-target-row" class="translate-target-row" hidden>
      <span class="translate-target-label">Translate into</span>
      <select id="translate-into" aria-label="Language to translate into"></select>
    </div>

    <header class="bar learning">
      <select id="view-mode" aria-label="How much of the transcript to show"></select>
      <label class="size" title="Text size in pixels">
        <input id="font-size" type="number" min="10" max="32" step="1" aria-label="Text size in pixels" />
        <span class="size-unit">px</span>
      </label>
      <!-- Where a word's reading goes. Kept in step with sidepanel.html by
           `test/browser/ui-preview.test.mjs`, which fails when the two diverge. -->
      <select id="reading" aria-label="Where to show the reading"></select>
      <select id="list" aria-label="Word list"></select>
      <select id="threshold" aria-label="Highlight from level"></select>
    </header>

    <p id="status" class="status" role="status">Looking for a video…</p>

    <section id="settings-view" class="settings-view" hidden aria-label="Settings">
      <header class="settings-head">
        <h2 class="settings-title">Settings</h2>
      </header>
      <div id="settings-body" class="settings-body"></div>
    </section>

    <main id="transcript" class="transcript" aria-label="Transcript">
      <p class="empty">No transcript loaded.</p>
    </main>

    <footer class="bar">
      <label class="follow">
        <input type="checkbox" id="follow" checked />
        Follow
      </label>
      <button id="copy" type="button">Copy</button>
      <select id="format" class="format" aria-label="Export format">
        <option value="txt">.txt</option>
        <option value="srt">.srt</option>
      </select>
      <button id="save" type="button">Save</button>
    </footer>

    <script type="module" src="/tools/ui/boot.mjs"></script>
  </body>
</html>
