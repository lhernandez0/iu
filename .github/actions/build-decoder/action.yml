name: Build the media decoder
description: >
  Build the compiled FFmpeg variant into src/vendor/ (gitignored, not committed).
  Shared by the jobs that need the artifact: `hermetic`, because the decode test
  must run against a real decoder rather than skip, and `package`, because the ZIP
  has to contain it. See THIRD-PARTY.md for why it is built rather than committed.

# A composite action rather than a repeated step, because the build has three
# separate hazards that should be solved once: a toolchain to install, an artifact
# to cache, and a SKIP that reports green. Repeating that in two jobs is how the
# third one drifts.

runs:
  using: composite
  steps:
    # The Emscripten toolchain, which is the whole reason this is a build product
    # rather than a committed file. ~300 MB against the 3.4 GB Docker image an
    # earlier revision pulled.
    - uses: emscripten-core/setup-emsdk@v14
      with:
        # Pinned to the version used to produce the artifact that was verified
        # locally. Not `latest`: a compiler that moves under a build is the thing
        # pinning exists to prevent.
        version: '3.1.74'

    # Cached on the build INPUTS, so an unchanged decoder is not rebuilt. The key
    # is a hash of everything that can change the output: the builder, the variant
    # definition, and the pinned revisions inside the builder. `restore-keys` is
    # deliberately absent: a partial match would restore a decoder built from
    # different inputs, which is worse than a miss.
    - uses: actions/cache@v4
      id: decoder-cache
      with:
        path: src/vendor/libav*
        key: libav-${{ hashFiles('tools/build-libav.mjs', 'tools/libav/add-variant.mjs') }}

    - name: build the decoder
      if: steps.decoder-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm run vendor:libav

    # The cache is a convenience; a success without the artifact is not. Asserted
    # rather than assumed, because a cache key that silently stopped matching would
    # turn this into a job that does nothing and reports green.
    - name: assert the decoder exists
      shell: bash
      run: |
        for f in libav.js libav-6.10.9.0-iu.wasm.mjs libav-6.10.9.0-iu.wasm.wasm; do
          if [ ! -f "src/vendor/$f" ]; then
            echo "::error::src/vendor/$f is missing after the build"
            exit 1
          fi
        done
        ls -la src/vendor/libav*
